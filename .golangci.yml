run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gofmt
    - goimports

linters-settings:
  gofmt:
    simplify: true

issues:
  exclude-dirs:
    - frontend
    - build
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
