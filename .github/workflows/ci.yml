name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux system dependencies (webkit2gtk, gtk3, xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # main.go's `//go:embed all:frontend/dist` requires frontend/dist to
      # exist (it's gitignored build output), so the frontend must be built
      # before any Go step that compiles main.go.
      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -v

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run wails dev in background (OAuth/Drive mocked at the network boundary)
        working-directory: .
        shell: bash
        env:
          # research.md §5 / quickstart.md's CI notes: mock Google OAuth
          # consent + Drive API responses at the network boundary so the
          # Playwright suite needs neither a real Google account nor real
          # network access. See mock_e2e.go.
          BALLAST_E2E_MOCK: "1"
          BALLAST_E2E_OUTCOME_FILE: "${{ github.workspace }}/e2e-outcome.txt"
        run: |
          # Ubuntu 24.04+ dropped the webkit2gtk-4.0 package entirely (only
          # 4.1 is installable, per the step above); Wails v2 needs the
          # `webkit2_41` build tag to target it, or cgo's pkg-config lookup
          # still tries the removed 4.0 package and fails to compile.
          WAILS_LAUNCH="$(go env GOPATH)/bin/wails dev"
          if [ "$RUNNER_OS" = "Linux" ]; then
            WAILS_LAUNCH="xvfb-run -a $(go env GOPATH)/bin/wails dev -tags webkit2_41"
          fi
          nohup $WAILS_LAUNCH > wails-dev.log 2>&1 &
          echo "Waiting for dev server on :34115..."
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:34115 > /dev/null 2>&1; then
              echo "Dev server is up."
              break
            fi
            sleep 2
          done

      - name: Run Playwright suite
        working-directory: frontend
        env:
          CI: "true"
          BALLAST_E2E_OUTCOME_FILE: "${{ github.workspace }}/e2e-outcome.txt"
        run: npx playwright test

      - name: Upload wails dev log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wails-dev-log-${{ matrix.os }}
          path: wails-dev.log
