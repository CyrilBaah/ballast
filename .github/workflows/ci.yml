name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux system dependencies (webkit2gtk, gtk3, xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # main.go embeds frontend/dist, so the frontend must be built before any Go step compiles it.
      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -v

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Skipped on Linux: wails dev's native webview crash-loops under Xvfb,
      # tracked in https://github.com/CyrilBaah/ballast/issues/2. go
      # build/vet/test already pass on Linux and Playwright passes on macOS + Windows.
      - name: Run wails dev in background (OAuth/Drive mocked at the network boundary)
        if: runner.os != 'Linux'
        working-directory: .
        shell: bash
        env:
          # Mocks Google OAuth consent + Drive API responses at the network
          # boundary so Playwright needs neither a real Google account nor real network access.
          BALLAST_E2E_MOCK: "1"
          BALLAST_E2E_OUTCOME_FILE: "${{ github.workspace }}/e2e-outcome.txt"
        run: |
          # Disable wails dev's file watchers: left on, Playwright's own
          # trace/screenshot output triggers reloads mid-test, and CI never needs live reload.
          WAILS_FLAGS="-noreload -nogorebuild"

          # Ubuntu 24.04+ only has webkit2gtk-4.1, so Wails needs the webkit2_41 build tag to target it.
          WAILS_LAUNCH="$(go env GOPATH)/bin/wails dev $WAILS_FLAGS"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Xvfb has no real GPU, so WebKitGTK's DMA-BUF renderer crash-loops unless disabled.
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            WAILS_LAUNCH="xvfb-run -a $(go env GOPATH)/bin/wails dev $WAILS_FLAGS -tags webkit2_41"
          fi
          nohup $WAILS_LAUNCH > wails-dev.log 2>&1 &
          echo "Waiting for dev server on :34115..."
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:34115 > /dev/null 2>&1; then
              echo "Dev server is up."
              break
            fi
            sleep 2
          done

      - name: Run Playwright suite
        id: playwright
        if: runner.os != 'Linux'
        working-directory: frontend
        env:
          CI: "true"
          BALLAST_E2E_OUTCOME_FILE: "${{ github.workspace }}/e2e-outcome.txt"
        run: npx playwright test

      - name: Upload wails dev log if Playwright failed
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: wails-dev-log-${{ matrix.os }}
          path: wails-dev.log
