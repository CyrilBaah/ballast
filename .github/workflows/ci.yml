name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Linux system dependencies (webkit2gtk, gtk3)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -v

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run wails dev in background
        working-directory: .
        shell: bash
        run: |
          nohup "$(go env GOPATH)/bin/wails" dev > wails-dev.log 2>&1 &
          echo "Waiting for dev server on :34115..."
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:34115 > /dev/null 2>&1; then
              echo "Dev server is up."
              break
            fi
            sleep 2
          done

      - name: Run Playwright suite
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test

      - name: Upload wails dev log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wails-dev-log-${{ matrix.os }}
          path: wails-dev.log
